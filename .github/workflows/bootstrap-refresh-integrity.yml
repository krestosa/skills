name: Bootstrap Final Integrity Refresh

on:
  push:
    branches:
      - ci/validate-focal-prompt-stack
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-final-integrity-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'krestosa/skills'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/validate-focal-prompt-stack
          fetch-depth: 0

      - name: Regenerate integrity for the final tree
        run: |
          rm .github/workflows/bootstrap-refresh-integrity.yml
          python scripts/tooling.py refresh-integrity
          python scripts/validate_focal_prompt_stack.py
          sudo --preserve-env=PATH python -m unittest discover -s tests -v
          python scripts/tooling.py validate
          python scripts/tooling.py check

      - name: Publish integrity metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/manifests/integrity.json
          git commit -m "Refresh integrity for final Focal prompt CI"
          git push origin HEAD:ci/validate-focal-prompt-stack
