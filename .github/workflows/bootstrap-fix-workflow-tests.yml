name: Bootstrap Workflow Test Fix

on:
  push:
    branches:
      - ci/validate-focal-prompt-stack
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-workflow-test-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'krestosa/skills'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/validate-focal-prompt-stack
          fetch-depth: 0

      - name: Correct workflow test indentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_dynamic_tooling.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def _write_fixture_workflow(self, action_ref: str, *, declare: bool) -> Path:
              workflow = self.fixture.root / ".github/workflows/fixture.yml"
              workflow.parent.mkdir(parents=True, exist_ok=True)
              workflow.write_text(
                  "name: Fixture\\n\\n"
                  "on:\\n  pull_request:\\n\\n"
                  "permissions:\\n  contents: read\\n\\n"
                  "jobs:\\n  validate:\\n    runs-on: ubuntu-latest\\n    timeout-minutes: 5\\n    steps:\\n"
                  f"      - uses: actions/checkout@{action_ref}\\n",
                  encoding="utf-8",
              )
              if declare:
                  config_path = self.fixture.root / "shared/manifests/tooling.json"
                  config = json.loads(config_path.read_text(encoding="utf-8"))
                  config.setdefault("workflowFiles", []).append(".github/workflows/fixture.yml")
                  config.setdefault("declaredFiles", []).append(".github/workflows/fixture.yml")
                  write_json(config_path, config)
              return workflow
          '''
          malformed = old.replace("              workflow", "    workflow").replace("              if declare", "    if declare").replace("                  config_path", "        config_path").replace("                  config =", "        config =").replace("                  config.setdefault", "        config.setdefault").replace("                  write_json", "        write_json").replace("              return workflow", "    return workflow")
          if text.count(malformed) != 1:
              raise SystemExit("malformed workflow test block did not match exactly once")
          path.write_text(text.replace(malformed, old), encoding="utf-8")
          PY

      - name: Remove bootstrap workflow and regenerate integrity
        run: |
          rm .github/workflows/bootstrap-fix-workflow-tests.yml
          python -m py_compile scripts/repository_tooling.py scripts/tooling.py scripts/validate.py tests/test_dynamic_tooling.py
          python scripts/tooling.py refresh-integrity

      - name: Publish correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix declared workflow validation tests"
          git push origin HEAD:ci/validate-focal-prompt-stack
