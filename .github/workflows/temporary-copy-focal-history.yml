# focal-temporary-workflow: true
name: Temporary export Focal history

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-copy-focal-history.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source prompt stack locally
        run: python3 scripts/validate_focal_prompt_stack.py

      - name: Install git-filter-repo
        run: python3 -m pip install --disable-pip-version-check git-filter-repo

      - name: Rewrite complete prompts history under focal
        run: |
          cp -a . ../rewritten
          cd ../rewritten
          git filter-repo --force --path prompts/ --path-rename prompts/:focal/
          test -f focal/focal-autonomous-development.md
          test -f focal/focal/13-autonomy-control-plane-v4.md
          test -z "$(git ls-files | grep -v '^focal/' || true)"

      - name: Validate rewritten content locally
        run: |
          cp -a . ../validation
          rm -rf ../validation/prompts
          mkdir -p ../validation/prompts
          cp -a ../rewritten/focal/. ../validation/prompts/
          cd ../validation
          python3 scripts/validate_focal_prompt_stack.py

      - name: Verify historical metadata preservation
        run: |
          python3 - <<'PY'
          import subprocess
          def rows(repo, path):
              return subprocess.check_output([
                  'git', '-C', repo, 'log', '--reverse',
                  '--format=%an%x09%ae%x09%aI%x09%cn%x09%ce%x09%cI%x09%s',
                  '--', path,
              ], text=True).splitlines()
          source_rows = rows('.', 'prompts')
          rewritten_rows = rows('../rewritten', 'focal')
          if not source_rows or source_rows != rewritten_rows:
              raise SystemExit('historical metadata mismatch')
          print(f'validated {len(rewritten_rows)} historical commits')
          PY

      - name: Publish filtered history branch in source repository
        env:
          EXPORT_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          cd ../rewritten
          git remote add export "$EXPORT_URL"
          git push --force export HEAD:refs/heads/focal-history-export
