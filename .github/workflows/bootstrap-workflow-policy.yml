name: Bootstrap Workflow Policy

on:
  push:
    branches:
      - ci/validate-focal-prompt-stack
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-workflow-policy
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'krestosa/skills'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/validate-focal-prompt-stack
          fetch-depth: 0

      - name: Migrate repository workflow policy
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path.cwd()

          tooling_path = root / "scripts/repository_tooling.py"
          tooling_text = tooling_path.read_text(encoding="utf-8")
          old_workflow_policy = '''    workflow_root = root / ".github" / "workflows"
              if workflow_root.exists():
                  raise issue("GITHUB_WORKFLOWS_PROHIBITED", relative(root, workflow_root), "workflows", workflow_root, "repository must not contain GitHub workflows")
          '''
          old_workflow_policy = old_workflow_policy.replace("              if", "    if").replace("                  raise", "        raise")
          new_workflow_policy = '''    workflow_files = tooling.get("workflowFiles", [])
              if not isinstance(workflow_files, list) or any(not isinstance(value, str) or not value for value in workflow_files):
                  raise issue("INVALID_WORKFLOW_FILES", anchors.tooling, "workflowFiles", workflow_files, "workflowFiles must be a string array")
              if len(workflow_files) != len(set(workflow_files)):
                  raise issue("DUPLICATE_WORKFLOW_FILE", anchors.tooling, "workflowFiles", workflow_files, "workflow paths must be unique")

              declared_workflows: set[Path] = set()
              for workflow_rel in workflow_files:
                  workflow_posix = PurePosixPath(workflow_rel.replace("\\\\", "/"))
                  if workflow_posix.parent != PurePosixPath(".github/workflows") or workflow_posix.suffix not in {".yml", ".yaml"}:
                      raise issue("INVALID_WORKFLOW_PATH", anchors.tooling, "workflowFiles", workflow_rel, "workflow must be a .yml or .yaml file directly under .github/workflows")
                  workflow_path = safe_path(root, workflow_rel, entity="tooling.workflowFiles", must_exist=True)
                  if not workflow_path.is_file():
                      raise issue("INVALID_WORKFLOW_FILE", relative(root, workflow_path), "workflow", workflow_path, "declared workflow must be a regular file")
                  workflow_text = workflow_path.read_text(encoding="utf-8")
                  if not re.search(r"(?m)^on:\\s*(?:#.*)?$", workflow_text):
                      raise issue("WORKFLOW_TRIGGER_MISSING", relative(root, workflow_path), "on", "missing", "workflow must declare triggers")
                  if not re.search(r"(?m)^permissions:\\s*(?:#.*)?$", workflow_text):
                      raise issue("WORKFLOW_PERMISSIONS_MISSING", relative(root, workflow_path), "permissions", "missing", "workflow must declare explicit top-level permissions")
                  if not re.search(r"(?m)^\\s+timeout-minutes:\\s*[1-9][0-9]*\\s*(?:#.*)?$", workflow_text):
                      raise issue("WORKFLOW_TIMEOUT_MISSING", relative(root, workflow_path), "timeout-minutes", "missing", "every workflow must declare a positive job timeout")
                  if re.search(r"(?m)^\\s*pull_request_target\\s*:", workflow_text):
                      raise issue("WORKFLOW_TRIGGER_PROHIBITED", relative(root, workflow_path), "trigger", "pull_request_target", "privileged pull_request_target workflows are prohibited")
                  for action_spec in re.findall(r"(?m)^\\s*-\\s*uses:\\s*([^\\s#]+)", workflow_text):
                      if action_spec.startswith("./"):
                          continue
                      action, separator, action_ref = action_spec.rpartition("@")
                      if not separator or not action or not re.fullmatch(r"[0-9a-f]{40}", action_ref):
                          raise issue("UNPINNED_WORKFLOW_ACTION", relative(root, workflow_path), "uses", action_spec, "external actions must be pinned to a full lowercase commit SHA")
                  expected.add(workflow_path)
                  declared_workflows.add(workflow_path.resolve())

              workflow_root = root / ".github" / "workflows"
              actual_workflows: set[Path] = set()
              if workflow_root.exists():
                  if not workflow_root.is_dir():
                      raise issue("INVALID_WORKFLOW_ROOT", relative(root, workflow_root), "workflows", workflow_root, ".github/workflows must be a directory")
                  actual_workflows = {
                      path.resolve()
                      for path in workflow_root.iterdir()
                      if path.is_file() and path.suffix in {".yml", ".yaml"}
                  }
              undeclared_workflows = sorted(relative(root, path) for path in actual_workflows - declared_workflows)
              if undeclared_workflows:
                  raise issue("UNDECLARED_GITHUB_WORKFLOW", relative(root, workflow_root), "workflows", ", ".join(undeclared_workflows), "every GitHub workflow must be declared in tooling.workflowFiles")
          '''
          new_workflow_policy = new_workflow_policy.replace("              if", "    if").replace("                  raise", "        raise").replace("              declared", "    declared").replace("              for", "    for").replace("                  workflow", "        workflow").replace("                  if", "        if").replace("                      raise", "            raise").replace("                  workflow_text", "        workflow_text").replace("                  for action", "        for action").replace("                      if action", "            if action").replace("                          continue", "                continue").replace("                      action,", "            action,").replace("                      if not separator", "            if not separator").replace("                  expected", "        expected").replace("                  declared_workflows", "        declared_workflows").replace("              workflow_root", "    workflow_root").replace("              actual_workflows", "    actual_workflows").replace("                  if not workflow_root", "        if not workflow_root").replace("                  actual_workflows", "        actual_workflows").replace("                      path.resolve", "            path.resolve").replace("                      for path", "            for path").replace("                      if path", "            if path").replace("                  }", "        }").replace("              undeclared", "    undeclared").replace("              if undeclared", "    if undeclared").replace("                  raise issue", "        raise issue")
          if tooling_text.count(old_workflow_policy) != 1:
              raise SystemExit("workflow prohibition block did not match exactly once")
          tooling_path.write_text(tooling_text.replace(old_workflow_policy, new_workflow_policy), encoding="utf-8")

          manifest_path = root / "shared/manifests/tooling.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          declared = list(manifest.get("declaredFiles", []))
          required_declared = [
              ".github/workflows/focal-prompt-validation.yml",
              "prompts/focal-autonomous-development.md",
              "prompts/focal/01-operating-cycle.md",
              "prompts/focal/02-autonomy-and-scope.md",
              "prompts/focal/03-coordination.md",
              "prompts/focal/04-roadmap.md",
              "prompts/focal/05-iris-capability-research.md",
              "prompts/focal/06-technical-requirements.md",
              "prompts/focal/07-validation-and-acceptance.md",
              "prompts/focal/08-terminal-report.md",
              "prompts/focal/09-skills-maintenance.md",
          ]
          for value in required_declared:
              if value not in declared:
                  declared.append(value)
          manifest["declaredFiles"] = declared
          manifest["workflowFiles"] = [".github/workflows/focal-prompt-validation.yml"]
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          validate_path = root / "scripts/validate.py"
          validate_text = validate_path.read_text(encoding="utf-8")
          old_status = '    print("github_workflows: absent")\n'
          new_status = '    print("github_workflows: declared-and-validated")\n'
          if validate_text.count(old_status) != 1:
              raise SystemExit("validate.py workflow status did not match exactly once")
          validate_path.write_text(validate_text.replace(old_status, new_status), encoding="utf-8")

          tests_path = root / "tests/test_dynamic_tooling.py"
          tests_text = tests_path.read_text(encoding="utf-8")
          old_fixture = '            "declaredFiles": ["orchestrator/delegation-envelope.schema.json"],\n            "flatBuild": {'
          new_fixture = '            "declaredFiles": ["orchestrator/delegation-envelope.schema.json"],\n            "workflowFiles": [],\n            "flatBuild": {'
          if tests_text.count(old_fixture) != 1:
              raise SystemExit("fixture tooling block did not match exactly once")
          tests_text = tests_text.replace(old_fixture, new_fixture)

          insertion_marker = '''    def test_registered_missing_skill_is_rejected(self) -> None:
          '''
          workflow_tests = '''    def _write_fixture_workflow(self, action_ref: str, *, declare: bool) -> Path:
              workflow = self.fixture.root / ".github/workflows/fixture.yml"
              workflow.parent.mkdir(parents=True, exist_ok=True)
              workflow.write_text(
                  "name: Fixture\\n\\n"
                  "on:\\n  pull_request:\\n\\n"
                  "permissions:\\n  contents: read\\n\\n"
                  "jobs:\\n  validate:\\n    runs-on: ubuntu-latest\\n    timeout-minutes: 5\\n    steps:\\n"
                  f"      - uses: actions/checkout@{action_ref}\\n",
                  encoding="utf-8",
              )
              if declare:
                  config_path = self.fixture.root / "shared/manifests/tooling.json"
                  config = json.loads(config_path.read_text(encoding="utf-8"))
                  config.setdefault("workflowFiles", []).append(".github/workflows/fixture.yml")
                  config.setdefault("declaredFiles", []).append(".github/workflows/fixture.yml")
                  write_json(config_path, config)
              return workflow

              def test_declared_pinned_workflow_is_allowed(self) -> None:
                  self._write_fixture_workflow("a" * 40, declare=True)
                  self.fixture.refresh()
                  validate_inventory(self.fixture.model())

              def test_undeclared_workflow_is_rejected(self) -> None:
                  self._write_fixture_workflow("a" * 40, declare=False)
                  with self.assertRaisesRegex(ToolingError, "UNDECLARED_GITHUB_WORKFLOW"):
                      self.fixture.model()

              def test_unpinned_workflow_action_is_rejected(self) -> None:
                  self._write_fixture_workflow("v7", declare=True)
                  with self.assertRaisesRegex(ToolingError, "UNPINNED_WORKFLOW_ACTION"):
                      self.fixture.model()

          '''
          workflow_tests = workflow_tests.replace("              def test_", "    def test_").replace("                  self.", "        self.").replace("                  validate_", "        validate_").replace("                  with self", "        with self").replace("                      self.fixture", "            self.fixture")
          if tests_text.count(insertion_marker) != 1:
              raise SystemExit("test insertion marker did not match exactly once")
          tests_path.write_text(tests_text.replace(insertion_marker, workflow_tests + insertion_marker), encoding="utf-8")
          PY

      - name: Remove bootstrap workflow and regenerate integrity
        run: |
          rm .github/workflows/bootstrap-workflow-policy.yml
          python scripts/tooling.py refresh-integrity

      - name: Publish migration commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Allow declared validation workflows"
          git push origin HEAD:ci/validate-focal-prompt-stack
