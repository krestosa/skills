name: Apply Focal Merge Traceability Migration

on:
  pull_request:
    paths:
      - "scripts/apply_focal_merge_traceability_patch.py"
      - ".github/workflows/focal-prompt-validation.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: focal-merge-traceability-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Apply and validate merge traceability policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply migration with one commit per governed file
        run: python scripts/apply_focal_merge_traceability_patch.py

      - name: Validate migrated Focal prompt contracts
        run: |
          python -m py_compile scripts/validate_focal_prompt_stack.py
          python scripts/validate_focal_prompt_stack.py

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Run unit tests under required root runtime
        run: sudo --preserve-env=PATH python -m unittest discover -s tests -v

      - name: Refresh repository integrity metadata
        shell: bash
        run: |
          python scripts/tooling.py --json refresh-integrity > /tmp/focal-integrity-refresh.json
          cat /tmp/focal-integrity-refresh.json
          if ! git diff --quiet -- shared/manifests/integrity.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add shared/manifests/integrity.json
            git commit -m "Refresh repository integrity metadata"
          fi

      - name: Validate final exact tree
        run: |
          python scripts/validate_focal_prompt_stack.py
          python scripts/tooling.py validate
          python scripts/tooling.py check
          test ! -e scripts/apply_focal_merge_traceability_patch.py
          git diff --exit-code origin/main -- .github/workflows/focal-prompt-validation.yml
          git diff --exit-code

      - name: Publish migrated branch
        run: git push origin "HEAD:${BRANCH_NAME}"

      - name: Dispatch canonical validation on final head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          payload=$(python - <<'PY'
          import json
          import os
          print(json.dumps({"ref": os.environ["BRANCH_NAME"]}))
          PY
          )
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/focal-prompt-validation.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "${payload}"
