name: Focal Prompt Validation

on:
  pull_request:
    paths:
      - "README.md"
      - "prompts/focal-autonomous-development.md"
      - "prompts/focal/**"
      - "scripts/repository_tooling.py"
      - "scripts/tooling.py"
      - "scripts/validate.py"
      - "scripts/validate_focal_prompt_stack.py"
      - "scripts/temporary_reconcile_focal_docs.py"
      - "tests/test_dynamic_tooling.py"
      - "shared/manifests/tooling.json"
      - "shared/manifests/integrity.json"
      - ".github/workflows/focal-prompt-validation.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "prompts/focal-autonomous-development.md"
      - "prompts/focal/**"
      - "scripts/repository_tooling.py"
      - "scripts/tooling.py"
      - "scripts/validate.py"
      - "scripts/validate_focal_prompt_stack.py"
      - "tests/test_dynamic_tooling.py"
      - "shared/manifests/tooling.json"
      - "shared/manifests/integrity.json"
      - ".github/workflows/focal-prompt-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focal-prompt-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Focal prompt stack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile coordination and generate blocker matrix
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python scripts/temporary_reconcile_focal_docs.py
          git show "${BASE_SHA}:.github/workflows/focal-prompt-validation.yml" > .github/workflows/focal-prompt-validation.yml
          python - <<'PY_WORKFLOW'
          from pathlib import Path

          path = Path(".github/workflows/focal-prompt-validation.yml")
          text = path.read_text(encoding="utf-8")
          needle = '    paths:\n      - "prompts/focal-autonomous-development.md"'
          replacement = '    paths:\n      - "README.md"\n      - "prompts/focal-autonomous-development.md"'
          if text.count(needle) != 2:
              raise SystemExit(f"unexpected workflow path blocks: {text.count(needle)}")
          path.write_text(text.replace(needle, replacement), encoding="utf-8")
          PY_WORKFLOW
          rm scripts/temporary_reconcile_focal_docs.py
          python scripts/tooling.py refresh-integrity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Reconcile Focal coordination and blocker documentation"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi

      - name: Validate Focal prompt contracts
        run: |
          python -m py_compile scripts/validate_focal_prompt_stack.py
          python scripts/validate_focal_prompt_stack.py

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Run unit tests under required root runtime
        run: sudo --preserve-env=PATH python -m unittest discover -s tests -v

      - name: Verify integrity metadata is current
        run: |
          python scripts/tooling.py --json refresh-integrity --dry-run > /tmp/focal-integrity-check.json
          cat /tmp/focal-integrity-check.json
          python - <<'PY_CHECK'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/focal-integrity-check.json").read_text(encoding="utf-8"))
          if payload.get("status") != "PASS":
              raise SystemExit("integrity dry-run failed")
          if payload.get("changed"):
              raise SystemExit("shared/manifests/integrity.json is stale")
          PY_CHECK

      - name: Run repository validation
        run: python scripts/tooling.py validate

      - name: Run repository checks
        run: python scripts/tooling.py check
