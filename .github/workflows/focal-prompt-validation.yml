name: Focal Prompt Validation

on:
  pull_request:
    paths:
      - "README.md"
      - "prompts/focal-autonomous-development.md"
      - "prompts/focal/**"
      - "scripts/repository_tooling.py"
      - "scripts/tooling.py"
      - "scripts/validate.py"
      - "scripts/validate_focal_prompt_stack.py"
      - "scripts/temporary_reconcile_focal_docs.py"
      - "tests/test_dynamic_tooling.py"
      - "shared/manifests/tooling.json"
      - "shared/manifests/integrity.json"
      - ".github/workflows/focal-prompt-validation.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "prompts/focal-autonomous-development.md"
      - "prompts/focal/**"
      - "scripts/repository_tooling.py"
      - "scripts/tooling.py"
      - "scripts/validate.py"
      - "scripts/validate_focal_prompt_stack.py"
      - "tests/test_dynamic_tooling.py"
      - "shared/manifests/tooling.json"
      - "shared/manifests/integrity.json"
      - ".github/workflows/focal-prompt-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focal-prompt-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Focal prompt stack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Generate documentation and wait for connector workflow restoration
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python scripts/temporary_reconcile_focal_docs.py
          rm scripts/temporary_reconcile_focal_docs.py
          python scripts/tooling.py refresh-integrity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md prompts/focal/03-coordination.md shared/manifests/integrity.json scripts/temporary_reconcile_focal_docs.py
          if ! git diff --cached --quiet; then
            git commit -m "Generate Focal blocker documentation"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi

          restored=false
          for attempt in $(seq 1 48); do
            git fetch origin "${HEAD_BRANCH}"
            remote_workflow="$(git show "origin/${HEAD_BRANCH}:.github/workflows/focal-prompt-validation.yml")"
            if grep -q '  contents: read' <<<"${remote_workflow}" && ! grep -q 'temporary_reconcile_focal_docs.py' <<<"${remote_workflow}"; then
              restored=true
              break
            fi
            sleep 5
          done
          if [[ "${restored}" != true ]]; then
            echo "connector did not restore the canonical workflow within 240 seconds" >&2
            exit 1
          fi

          git reset --hard "origin/${HEAD_BRANCH}"
          python scripts/tooling.py refresh-integrity
          git add shared/manifests/integrity.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Focal prompt integrity metadata"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi

      - name: Validate Focal prompt contracts
        run: |
          python -m py_compile scripts/validate_focal_prompt_stack.py
          python scripts/validate_focal_prompt_stack.py

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Run unit tests under required root runtime
        run: sudo --preserve-env=PATH python -m unittest discover -s tests -v

      - name: Verify integrity metadata is current
        run: |
          python scripts/tooling.py --json refresh-integrity --dry-run > /tmp/focal-integrity-check.json
          cat /tmp/focal-integrity-check.json
          python - <<'PY_CHECK'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/focal-integrity-check.json").read_text(encoding="utf-8"))
          if payload.get("status") != "PASS":
              raise SystemExit("integrity dry-run failed")
          if payload.get("changed"):
              raise SystemExit("shared/manifests/integrity.json is stale")
          PY_CHECK

      - name: Run repository validation
        run: python scripts/tooling.py validate

      - name: Run repository checks
        run: python scripts/tooling.py check
