name: Focal Prompt Validation

on:
  pull_request:
    paths:
      - "README.md"
      - "prompts/focal-autonomous-development.md"
      - "prompts/focal/**"
      - "scripts/repository_tooling.py"
      - "scripts/tooling.py"
      - "scripts/validate.py"
      - "scripts/validate_focal_prompt_stack.py"
      - "tests/test_dynamic_tooling.py"
      - "shared/manifests/tooling.json"
      - "shared/manifests/integrity.json"
      - ".github/workflows/focal-prompt-validation.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "prompts/focal-autonomous-development.md"
      - "prompts/focal/**"
      - "scripts/repository_tooling.py"
      - "scripts/tooling.py"
      - "scripts/validate.py"
      - "scripts/validate_focal_prompt_stack.py"
      - "tests/test_dynamic_tooling.py"
      - "shared/manifests/tooling.json"
      - "shared/manifests/integrity.json"
      - ".github/workflows/focal-prompt-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focal-prompt-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Focal prompt stack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Focal prompt contracts
        run: |
          python -m py_compile scripts/validate_focal_prompt_stack.py
          python scripts/validate_focal_prompt_stack.py

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Run unit tests under required root runtime
        run: sudo --preserve-env=PATH python -m unittest discover -s tests -v

      - name: Generate refreshed integrity metadata
        shell: bash
        run: |
          set +e
          python scripts/tooling.py --json refresh-integrity > /tmp/focal-integrity-refresh.json 2>&1
          status=$?
          cat /tmp/focal-integrity-refresh.json
          exit "$status"

      - name: Upload integrity diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: focal-integrity-diagnostics-${{ github.sha }}
          path: |
            shared/manifests/integrity.json
            /tmp/focal-integrity-refresh.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify integrity metadata is current
        run: git diff --exit-code -- shared/manifests/integrity.json

      - name: Run repository validation
        run: python scripts/tooling.py validate

      - name: Run repository checks
        run: python scripts/tooling.py check
